[project]
name = "gcp-janitor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aaron D Borden", email = "adborden@a14n.net" }
]
requires-python = ">=3.14"
dependencies = [
    "google-cloud-kms>=3.18.0",
    "google-cloud-storage>=3.17.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
gcp-janitor = "gcp_janitor:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
