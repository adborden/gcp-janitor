apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: gcp-janitor
      app.kubernetes.io/component: controller
    includeSelectors: true
    includeTemplates: true

resources:
  - resources/serviceaccount.yaml
  - resources/deployment.yaml
  - resources/networkpolicy.yaml

configMapGenerator:
  - name: gcp-janitor-config
    files:
      - config.toml=files/config.toml
  - name: gcp-janitor-gcp-credentials
    files:
      - credential-configuration.json=files/credential-configuration.json

images:
  - name: gcp-janitor
    newName: ghcr.io/adborden/gcp-janitor
    newTag: latest
