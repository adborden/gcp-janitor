apiVersion: v1
kind: ServiceAccount
metadata:
  name: gcp-janitor
# The app does not talk to the Kubernetes API, so the default API token is not
# mounted. GCP credentials come from a projected token with a GCP-only audience
# (see the gcp-credentials volume in the Deployment). The Workload Identity
# principal is system:serviceaccount:<namespace>:gcp-janitor.
automountServiceAccountToken: false
