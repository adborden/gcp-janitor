# The app exposes no ports: deny all ingress. Egress stays open because it must
# reach the GKE metadata server and *.googleapis.com.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gcp-janitor
spec:
  podSelector:
    matchLabels: {}
  policyTypes:
    - Ingress
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 443
